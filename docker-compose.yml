services:
  db:
    image: postgres:18
    container_name: sato_db
    environment:
      POSTGRES_USER: sato
      POSTGRES_PASSWORD: sato_password
      POSTGRES_DB: sato_development
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sato"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
